name: SAST with SonarQube

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  sonar_scan:
    runs-on: ubuntu-latest

    services:
      sonarqube:
        image: sonarqube:latest
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/api/system/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SONAR_HOST_URL: http://sonarqube:9000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Wait for SonarQube to be ready
        run: |
          echo "Aguardando SonarQube inicializar..."
          for i in {1..30}; do
            if curl -s ${SONAR_HOST_URL}/api/system/health | grep -q '"status":"GREEN"'; then
              echo "SonarQube está pronto!"
              break
            fi
            echo "Ainda não: tentativa $i"
            sleep 10
          done

      - name: Set up Java (SonarScanner)
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache SonarScanner
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Install jq and SonarQube Scanner CLI
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          curl -sSLo sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.7.0.2747-linux.zip
          unzip sonar-scanner.zip
          echo "${{ github.workspace }}/sonar-scanner-4.7.0-*-linux/bin" >> $GITHUB_PATH

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.login=${SONAR_TOKEN} \
            -Djava.net.preferIPv4Stack=true

      - name: Quality Gate Check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          STATUS="$(curl -s -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=cimatec" \
            | jq -r .projectStatus.status)"
          echo "Quality Gate status: $STATUS"
          if [ "$STATUS" != "OK" ]; then
            echo "🚨 Quality Gate failed"
            exit 1
          fi
